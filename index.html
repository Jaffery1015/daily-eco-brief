<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="每日经济早报：为经济学新生打造的每日财经速读，深色主题、手机友好。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="经济早报">
<title>每日经济早报</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="progress" id="progressBar"></div>

<header class="app-header">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">📰</div>
    <div class="brand-text">
      <h1>每日经济早报</h1>
      <p class="brand-sub">经济学新生 · 每日财经速读</p>
    </div>
  </div>
  <div class="header-actions">
    <button id="historyBtn" class="icon-btn" title="历史早报" aria-label="历史早报">📚</button>
    <button id="refreshBtn" class="icon-btn" title="刷新最新早报" aria-label="刷新">🔄</button>
  </div>
</header>

<div class="meta-bar" id="metaBar" hidden>
  <span class="chip" id="dateChip">—</span>
  <span class="chip chip-muted" id="cutoffChip">—</span>
  <span class="chip chip-accent" id="offlineChip" hidden>离线阅读</span>
  <button type="button" class="chip chip-accent chip-btn" id="backLatest" hidden>回到最新</button>
</div>

<main id="app" class="app-main">
  <div class="loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>正在加载今日早报…</p>
  </div>
</main>

<footer class="app-footer">
  <p>⚠️ 本早报仅供学习参考，不构成投资建议</p>
  <p class="foot-note">每日经济早报 · 由 Codex 经济学助手自动生成</p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="历史早报" hidden>
  <div class="drawer-head">
    <h2>📚 历史早报</h2>
    <button id="drawerClose" class="icon-btn" aria-label="关闭">✕</button>
  </div>
  <ul class="drawer-list" id="drawerList"></ul>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
